name: Defect
description: Something is broken
title: "[Defect] "
labels: ["type:defect", "status:awaiting-approval"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What's broken?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files to touch
  - type: textarea
    id: test-strategy
    attributes:
      label: Test strategy
    validations:
      required: true
