databaseChangeLog:
  - changeSet:
      id: 017-deck-categories-profile-id
      author: opencode
      changes:
        - addColumn:
            tableName: deck_categories
            columns:
              - column:
                  name: profile_id
                  type: bigint
        - sql:
            sql: >-
              update deck_categories
              set profile_id = decks.profile_id
              from decks
              where deck_categories.deck_id = decks.id
        - addNotNullConstraint:
            tableName: deck_categories
            columnName: profile_id
            columnDataType: bigint
        - addForeignKeyConstraint:
            baseTableName: deck_categories
            baseColumnNames: profile_id
            referencedTableName: profiles
            referencedColumnNames: id
            constraintName: fk_deck_categories_profile
            onDelete: CASCADE
        - createIndex:
            tableName: deck_categories
            indexName: idx_deck_categories_profile_name
            columns:
              - column:
                  name: profile_id
              - column:
                  name: name
