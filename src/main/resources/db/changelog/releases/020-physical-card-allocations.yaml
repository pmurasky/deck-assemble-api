databaseChangeLog:
  - changeSet:
      id: 020-physical-card-allocations
      author: opencode
      changes:
        - createTable:
            tableName: physical_card_allocations
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_physical_card_allocations
                    nullable: false
              - column:
                  name: deck_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: deck_card_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: collection_card_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_at
                  type: timestamptz
              - column:
                  name: updated_by
                  type: varchar(255)
        - addUniqueConstraint:
            tableName: physical_card_allocations
            columnNames: deck_card_id, collection_card_id
            constraintName: uq_physical_card_allocations_deck_card_collection_card
        - addForeignKeyConstraint:
            baseTableName: physical_card_allocations
            baseColumnNames: deck_id
            referencedTableName: decks
            referencedColumnNames: id
            constraintName: fk_physical_card_allocations_deck
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: physical_card_allocations
            baseColumnNames: deck_card_id
            referencedTableName: deck_cards
            referencedColumnNames: id
            constraintName: fk_physical_card_allocations_deck_card
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: physical_card_allocations
            baseColumnNames: collection_card_id
            referencedTableName: collection_cards
            referencedColumnNames: id
            constraintName: fk_physical_card_allocations_collection_card
            onDelete: CASCADE
        - createIndex:
            tableName: physical_card_allocations
            indexName: idx_physical_card_allocations_deck
            columns:
              - column:
                  name: deck_id
        - createIndex:
            tableName: physical_card_allocations
            indexName: idx_physical_card_allocations_collection_card
            columns:
              - column:
                  name: collection_card_id
