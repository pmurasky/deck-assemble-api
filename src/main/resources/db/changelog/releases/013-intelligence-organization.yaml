            columnNames: profile_id, name
            constraintName: uq_deck_tags_profile_name
        - addUniqueConstraint:
            tableName: deck_tag_assignments
            columnNames: deck_id, tag_id
            constraintName: uq_deck_tag_assignments_deck_tag
