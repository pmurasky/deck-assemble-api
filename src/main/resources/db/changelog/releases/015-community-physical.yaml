databaseChangeLog:
  - changeSet:
      id: 015-deck-collaborators
      author: opencode
      changes:
        - createTable:
            tableName: deck_collaborators
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_deck_collaborators
                    nullable: false
              - column:
                  name: deck_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: profile_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(255)
        - addUniqueConstraint:
            tableName: deck_collaborators
            columnNames: deck_id, profile_id
            constraintName: uq_deck_collaborators_deck_profile
        - addForeignKeyConstraint:
            baseTableName: deck_collaborators
            baseColumnNames: deck_id
            referencedTableName: decks
            referencedColumnNames: id
            constraintName: fk_deck_collaborators_deck
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: deck_collaborators
            baseColumnNames: profile_id
            referencedTableName: profiles
            referencedColumnNames: id
            constraintName: fk_deck_collaborators_profile
            onDelete: CASCADE
        - createIndex:
            tableName: deck_collaborators
            indexName: idx_deck_collaborators_deck_id
            columns:
              - column:
                  name: deck_id
