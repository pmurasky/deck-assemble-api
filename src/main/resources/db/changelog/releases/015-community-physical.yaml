  - changeSet:
      id: 015-notifications
      author: opencode
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_notifications
                    nullable: false
              - column:
                  name: recipient_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: bigint
              - column:
                  name: reason
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: read_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: recipient_id
            referencedTableName: profiles
            referencedColumnNames: id
            constraintName: fk_notifications_recipient
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: actor_id
            referencedTableName: profiles
            referencedColumnNames: id
            constraintName: fk_notifications_actor
            onDelete: SET NULL
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_recipient_read_at
            columns:
              - column:
                  name: recipient_id
              - column:
                  name: read_at
  - changeSet:
      id: 015-moderation-reports
      author: opencode
      changes:
        - createTable:
            tableName: moderation_reports
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_moderation_reports
                    nullable: false
              # No FK on reporter_id -> ON DELETE SET NULL, and no FK at all on the reported
              # resource (resource_type/resource_id) by design: moderation reports are a
              # retained audit trail that must survive deletion of the reporter's account or
              # the reported resource. See ModerationReport.java.
              - column:
                  name: reporter_id
                  type: bigint
              - column:
                  name: resource_type
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: text
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: OPEN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: moderation_reports
            baseColumnNames: reporter_id
            referencedTableName: profiles
            referencedColumnNames: id
            constraintName: fk_moderation_reports_reporter
            onDelete: SET NULL
        - createIndex:
            tableName: moderation_reports
            indexName: idx_moderation_reports_status
            columns:
              - column:
                  name: status
